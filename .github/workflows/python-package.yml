name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tdfextractor
        uses: actions/checkout@v7
        with:
          path: tdfextractor

      # tdfextractor currently depends on unreleased versions of the sibling
      # projects (see [tool.uv.sources] in pyproject.toml). Check them out in
      # the layout uv expects.
      - name: Checkout tdfpy
        uses: actions/checkout@v7
        with:
          repository: tacular-omics/tdfpy
          path: tdfpy

      - name: Checkout serenipy
        uses: actions/checkout@v7
        with:
          repository: pgarrett-scripps/serenipy
          path: serenipy

      - name: Checkout psims
        uses: actions/checkout@v7
        with:
          repository: pgarrett-scripps/psims
          path: psims

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        working-directory: tdfextractor
        run: just install

      - name: Lint with ruff
        working-directory: tdfextractor
        run: just lint

      - name: Type check with ty
        working-directory: tdfextractor
        run: just ty

      - name: Test with pytest
        working-directory: tdfextractor
        run: just test
